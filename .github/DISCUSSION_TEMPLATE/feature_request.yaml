title: "[Feature request] <put descriptive title here>"
labels: [ "feature-request" ]
body:
    -   type: textarea
        id: description
        attributes:
            label: Feature description
            description: A clear and concise description of what you want to improve
        validations:
            required: true
    -   type: textarea
        id: experience
        attributes:
            label: How it improves the player experience
            description: Describe how this would make the game more fun, deep, intuitive, interesting or immersive
        validations:
            required: true
    -   type: textarea
        id: synergies
        attributes:
            label: Tetra synergies
            description: How does this fit with, expand upon, or synergize with current features in tetra
        validations:
            required: true
